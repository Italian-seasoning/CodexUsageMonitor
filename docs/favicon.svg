<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Runway — allowance ahead</title>
  <desc id="desc">An open amber glass allowance gauge, with a translucent remaining segment and a violet AI spark marking the current usage, on warm ivory.</desc>
  <defs>
    <linearGradient id="tile" x1="238" y1="64" x2="802" y2="960" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFEF9"/><stop offset=".55" stop-color="#F4EEE6"/><stop offset="1" stop-color="#DDD4CA"/></linearGradient>
    <linearGradient id="rim" x1="204" y1="74" x2="852" y2="917" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".25"/><stop offset="1" stop-color="#BFB1A7" stop-opacity=".65"/></linearGradient>
    <linearGradient id="amber" x1="294" y1="696" x2="654" y2="308" gradientUnits="userSpaceOnUse"><stop stop-color="#C24C25"/><stop offset=".3" stop-color="#FF872F"/><stop offset=".68" stop-color="#FFC35D"/><stop offset="1" stop-color="#FFE2A0"/></linearGradient>
    <linearGradient id="remaining" x1="683" y1="317" x2="692" y2="697" gradientUnits="userSpaceOnUse"><stop stop-color="#EEE3F6" stop-opacity=".8"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".52"/><stop offset="1" stop-color="#D4C7B8" stop-opacity=".65"/></linearGradient>
