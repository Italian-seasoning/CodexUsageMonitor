    <linearGradient id="facet" x1="633" y1="279" x2="733" y2="396" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF0FF"/><stop offset="1" stop-color="#CBA3ED" stop-opacity=".15"/></linearGradient>
    <filter id="tileShadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#32251D" flood-opacity=".17"/></filter>
    <filter id="ringShadow" x="150" y="150" width="724" height="724" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#915629" flood-opacity=".19"/></filter>
    <filter id="sparkShadow" x="526" y="187" width="302" height="321" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#653B79" flood-opacity=".26"/></filter>
